name: Stabilization regression checks
on:
  pull_request:
    paths:
      - 'pipeline/desk_discovery.py'
      - 'pipeline/test_desk_discovery.py'
      - 'v3_core/**'
      - 'tests/test_v3_*.py'
      - '.github/workflows/stabilization-regression.yml'
  workflow_dispatch:
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline test dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Verify approved-content bridge fixtures (no network or builds)
        run: python -m unittest discover -s pipeline -p 'test_refresh_publication.py' -v
      - name: Verify publication retry safeguards (offline)\n        run: python -m unittest discover -s pipeline -p 'test_publication_retry_guards.py' -v\n      - name: Verify editorial discovery and safeguards
        run: python -m unittest discover -s pipeline -p 'test_desk_discovery.py' -v
