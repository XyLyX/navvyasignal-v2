name: Stabilization regression checks
on:
  pull_request:
    paths:
      - 'pipeline/desk_discovery.py'
      - 'pipeline/test_desk_discovery.py'
      - 'v3_core/**'
      - 'tests/test_v3_*.py'
      - '.github/workflows/stabilization-regression.yml'
  workflow_dispatch:
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline test dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Verify editorial discovery and safeguards
        run: python -m unittest discover -s pipeline -p 'test_desk_discovery.py' -v
      - name: Verify isolated V3 editorial policy
        run: python -m unittest discover -s tests -p 'test_v3_*.py' -v
