name: V2 preview validation
on:
  push:
    branches: [notion-readonly, release/v2-english]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: navvyasignal-v2-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: navvyasignal-v2-starter/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          # Intentionally omit Notion credentials; the static empty-state build must also work.
          NOTION_TOKEN: ''
          NOTION_DATA_SOURCE_ID: ''
          V2_CI_STATIC_FIXTURE: '1'
