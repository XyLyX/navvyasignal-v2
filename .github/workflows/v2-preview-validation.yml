name: V2 preview validation
on:
  push:
    branches: [main, release/v2-english, fix/regional-daily-release, fix/editorial-formats, fix/daily-recovery, fix/delivery-resume]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: navvyasignal-v2-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: navvyasignal-v2-starter/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          # Intentionally omit Notion credentials; the static empty-state build must also work.
          NOTION_TOKEN: ''
          NOTION_DATA_SOURCE_ID: ''
          V2_CI_STATIC_FIXTURE: '1'
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pipeline.run_offline_tests
        env:
          ANTHROPIC_API_KEY: test-only
