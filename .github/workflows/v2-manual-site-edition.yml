name: V2 manual site edition

# Select today's approved Signal Feed entries and request one production build.
# This workflow has no Kit or Whapi credentials or send path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-site-edition
  cancel-in-progress: false

jobs:
  edition:
    if: github.repository == 'XyLyX/navvyasignal-v2' && vars.V2_SITE_ONLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Select site edition in Notion
        id: edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          RUN_TYPE: site_only
          DRY_RUN: 'false'
          SEND_OUTPUT: 'false'
        run: python main.py
      - name: Request one Netlify refresh
        if: steps.edition.outputs.notion_stage_attempted == 'true' && vars.V2_REFRESH_ENABLED == 'true'
        env:
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          try:
              marker = json.load(open('notion-stage-attempted.json'))
              valid = (str(marker.get('run_id')) == os.environ['GH_RUN_ID']
                       and str(marker.get('attempt')) == os.environ['GH_RUN_ATTEMPT'])
          except (OSError, ValueError, KeyError):
              valid = False
          sys.exit(0 if valid else 1)
          PY
          if ! printf '%s' "${V2_NETLIFY_BUILD_HOOK:-}" | grep -Eq '^https://api\.netlify\.com/build_hooks/[A-Za-z0-9]+$'; then
            echo 'V2 refresh hook missing or malformed'; exit 1
          fi
          curl --fail --silent --show-error --retry 2 --max-time 30 -X POST "$V2_NETLIFY_BUILD_HOOK"
          echo 'V2 refresh queued'
