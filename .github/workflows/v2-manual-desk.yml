name: V2 manual desk publication

# This workflow can publish one desk to Notion. It carries no Kit or Whapi
# credentials. Verified stories are private until the 09:00 release. No build path.
on:
  workflow_dispatch:
    inputs:
      desk:
        description: Desk to research and publish to Signal Feed
        required: true
        type: choice
        options: [north_america, europe, india_subcontinent, uae_middle_east]

permissions:
  contents: read

concurrency:
  group: v2-manual-desk-${{ inputs.desk }}
  cancel-in-progress: false

jobs:
  desk:
    if: github.repository == 'XyLyX/navvyasignal-v2' && vars.V2_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Publish selected desk to Notion
        id: editorial
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_TYPE: ${{ inputs.desk }}
          DRY_RUN: 'false'
          SEND_OUTPUT: 'false'
        run: python main.py
