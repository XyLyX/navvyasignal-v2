name: V2 manual desk publication

# This workflow can publish one desk to Notion. It carries no Kit or Whapi
# credentials. Successful publication refreshes the site; homepage selection stays separate.
on:
  workflow_dispatch:
    inputs:
      desk:
        description: Desk to research and publish to Signal Feed
        required: true
        type: choice
        options:
          - maritime_energy
          - west_asia
          - markets_capital
          - technology_ai
          - global_politics
          - uae
          - india

permissions:
  contents: read

concurrency:
  group: v2-manual-desk-${{ inputs.desk }}
  cancel-in-progress: false

jobs:
  desk:
    if: github.repository == 'XyLyX/navvyasignal-v2' && vars.V2_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Publish selected desk to Notion
        id: editorial
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_TYPE: ${{ inputs.desk }}
          DRY_RUN: 'false'
          SEND_OUTPUT: 'false'
        run: python main.py
      - name: Request isolated V2 refresh
        if: always() && steps.editorial.outputs.notion_stage_attempted == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ! python3 - <<'PY'
          import json, os, sys
          try:
              m = json.load(open('notion-stage-attempted.json'))
              valid = (str(m.get('run_id')) == os.environ['GH_RUN_ID']
                       and str(m.get('attempt')) == os.environ['GH_RUN_ATTEMPT'])
          except (OSError, ValueError, KeyError):
              valid = False
          sys.exit(0 if valid else 1)
          PY
          then
            echo 'V2 refresh marker missing or invalid'; exit 0
          fi
          if ! printf '%s' "${V2_NETLIFY_BUILD_HOOK:-}" | grep -Eq '^https://api\.netlify\.com/build_hooks/[A-Za-z0-9]+$'; then
            echo 'V2 refresh hook missing or malformed'; exit 0
          fi
          curl --fail --silent --show-error --retry 2 --max-time 30 -X POST "$V2_NETLIFY_BUILD_HOOK" \
            && echo 'V2 refresh queued' || echo 'V2 refresh request failed'
