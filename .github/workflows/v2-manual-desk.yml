name: V2 manual desk publication

# This workflow can publish one desk to Notion. It carries no Kit or Whapi
# credentials. Successful publication refreshes the site; homepage selection stays separate.
on:
  workflow_dispatch:
    inputs:
      desk:
        description: Desk to research and publish to Signal Feed
        required: true
        type: choice
        options:
          - maritime_energy
          - west_asia
          - markets_capital
          - technology_ai
          - global_politics
          - uae
          - india

permissions:
  contents: read

concurrency:
  group: v2-manual-desk-${{ inputs.desk }}
  cancel-in-progress: false

jobs:
  desk:
    if: github.repository == 'XyLyX/navvyasignal-v2' && vars.V2_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Publish selected desk to Notion
        id: editorial
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_TYPE: ${{ inputs.desk }}
          DRY_RUN: 'false'
          SEND_OUTPUT: 'false'
        run: python main.py
      - name: Request isolated V2 refresh
        if: always() && steps.editorial.outputs.notion_stage_attempted == 'true'
        timeout-minutes: 15
        env:
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          DRY_RUN: 'false'
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 refresh_publication.py
