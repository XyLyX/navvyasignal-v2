name: V2 static content refresh
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare approved content without triggering a build
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: v2-static-content-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'XyLyX/navvyasignal-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: v2-preview
    steps:
      - name: Check external scheduler ownership
        id: timer
        if: github.event_name == 'schedule'
        env:
          SCHEDULER_STATUS_URL: https://navvyasignal.com/api/scheduler-status
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          try:
              with urllib.request.urlopen(os.environ['SCHEDULER_STATUS_URL'], timeout=15) as response:
                  status = json.load(response)
              if status.get('version') != 1 or not isinstance(status.get('active'), bool):
                  raise RuntimeError('Invalid scheduler ownership response')
              owned = status['active']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              owned = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('external=' + str(owned).lower() + '\n')
          print('Netlify owns scheduling: ' + str(owned))
          PY
      - uses: actions/checkout@v4
        if: steps.timer.outputs.external != 'true'
      - uses: actions/setup-python@v5
        if: steps.timer.outputs.external != 'true'
        with:
          python-version: '3.11'
      - name: Refresh only changed approved public content
        if: steps.timer.outputs.external != 'true'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python pipeline/refresh_publication.py
