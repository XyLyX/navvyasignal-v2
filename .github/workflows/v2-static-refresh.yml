name: V2 static content refresh
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare approved content without triggering a build
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: v2-static-content-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'XyLyX/navvyasignal-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: v2-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh only changed approved public content
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python pipeline/refresh_publication.py
