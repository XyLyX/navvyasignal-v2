name: Explicit exceptional publication
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      publish_now:
        description: Explicitly authorize an exceptional production build
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: regional-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'XyLyX/navvyasignal-v2'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - name: Check public snapshot without building
        if: inputs.dry_run || !inputs.publish_now
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          DRY_RUN: 'true'
        run: python pipeline/refresh_publication.py
      - name: Publish explicitly approved Now action
        if: inputs.publish_now && !inputs.dry_run
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          DRY_RUN: 'false'
        run: python pipeline/regional_release.py --exceptional
