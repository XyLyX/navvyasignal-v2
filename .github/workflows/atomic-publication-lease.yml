name: Atomic publication lease contract
on:
  pull_request:
    paths:
      - 'ops/publication_atomic_lease.sql'
      - 'v3_core/atomic_lease.py'
      - 'tests/test_atomic_lease*.py'
      - 'v3_core/postgres_publication_lease.py'
      - 'tests/test_postgres_publication_lease_client.py'
      - '.github/workflows/atomic-publication-lease.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-lease-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test fail-closed lease parsing and contention model
        run: |
          python -m unittest discover -s tests -p 'test_atomic_lease*.py' -v
          python -m unittest discover -s tests -p 'test_postgres_publication_lease_client.py' -v
