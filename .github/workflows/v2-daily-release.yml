name: Regional 09:00 release
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      edition_date:
        type: string
        description: Intended Dubai edition date YYYY-MM-DD
      dry_run:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: regional-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'XyLyX/navvyasignal-v2'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check external scheduler ownership
        id: timer
        if: github.event_name == 'schedule'
        env:
          SCHEDULER_STATUS_URL: https://navvyasignal.com/api/scheduler-status
        run: python pipeline/scheduler_ownership.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - name: Release approved staged stories and build once
        if: github.event_name != 'schedule' || steps.timer.outputs.external == 'false'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          V2_EDITION_DATE: ${{ inputs.edition_date }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python pipeline/regional_release.py
      - name: Notify held Unverified Signals without automatic review
        if: always() && (github.event_name != 'schedule' || steps.timer.outputs.external == 'false')
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python pipeline/notify_unverified.py
      - name: Alert private operator on release failure
        if: failure()
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python pipeline/notify_run_failure.py
