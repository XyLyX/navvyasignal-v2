name: Recover Sept 29 V2 WhatsApp edition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: github.repository == 'XyLyX/navvyasignal-v2' && vars.V2_SENDER_ENABLED == 'true' && vars.V2_LEGACY_SENDER_DISABLED == 'true'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check and recover channel edition without email
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          V2_SENDER_ENABLED: ${{ vars.V2_SENDER_ENABLED }}
          V2_LEGACY_SENDER_DISABLED: ${{ vars.V2_LEGACY_SENDER_DISABLED }}
        run: python recover_whapi_2026_09_29.py
