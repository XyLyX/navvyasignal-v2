name: V2 read-only publication audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2-readonly-publication-audit.yml']
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'XyLyX/navvyasignal-v2'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg[binary]==3.2.10'
      - name: Check approved Notion snapshot and durable lease without publishing
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          PUBLICATION_DATABASE_URL: ${{ secrets.PUBLICATION_DATABASE_URL }}
          PUBLICATION_LEASE_REQUIRED: ${{ vars.PUBLICATION_LEASE_REQUIRED }}
          DRY_RUN: 'true'
        run: |
          python - <<'PY'
          from pipeline import publication_lease_gate as gate
          if not gate.required():
              raise RuntimeError("Production publication lease disabled")
          with gate.connect() as conn:
              with conn.cursor() as cursor:
                  cursor.execute("select phase, updated_at from publication_private.leases where resource=%s", (gate.RESOURCE,))
                  row=cursor.fetchone()
          if row:
              phase, updated_at=row
              print("Lease phase:",phase)
              if phase in ('build_requested','ambiguous'):
                  raise RuntimeError("Publication lease requires reconciliation; no automatic replay")
          else:
              print("No publication lease exists; awaiting first production publication")
          from pipeline import refresh_publication
          refresh_publication.main(approved_refresh=True)
          print("Read-only publication audit complete; no build requested")
          PY
