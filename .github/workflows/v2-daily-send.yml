name: V2 daily email and WhatsApp

# Runs after the verified 09:00 Dubai regional release. This job only reads approved
# Signals from Notion and sends them; it never requests a site rebuild.
on:
  schedule:
    - cron: '0 6 * * *' # 10:00 Dubai
  workflow_dispatch:
    inputs:
      edition_date:
        description: 'Optional edition date for recovery (YYYY-MM-DD); blank uses the automatic Dubai edition'
        type: string
        required: false
      dry_run:
        description: Compile and validate without Kit or WhatsApp delivery
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: v2-daily-send
  cancel-in-progress: false

jobs:
  send:
    if: github.repository == 'XyLyX/navvyasignal-v2' && (github.event_name == 'workflow_dispatch' && inputs.dry_run || (vars.V2_SENDER_ENABLED == 'true' && vars.V2_LEGACY_SENDER_DISABLED == 'true'))
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Check external scheduler ownership
        id: timer
        working-directory: ${{ github.workspace }}
        if: github.event_name == 'schedule'
        env:
          SCHEDULER_STATUS_URL: https://navvyasignal.com/api/scheduler-status
        run: python pipeline/scheduler_ownership.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify release before delivery
        id: eligibility
        if: github.event_name != 'schedule' || steps.timer.outputs.external == 'false'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          V2_SEND_EDITION_DATE: ${{ inputs.edition_date }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python verify_regional_send.py
      - name: Compile and send one daily edition
        if: github.event_name != 'schedule' || steps.timer.outputs.external == 'false'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FROM_EMAIL: ${{ secrets.KIT_FROM_EMAIL || 'hello@navvyasignal.com' }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          OPS_NOTIFY_NUMBER: ${{ secrets.OPS_NOTIFY_NUMBER }}
          V2_SEND_EDITION_DATE: ${{ inputs.edition_date }}
          RUN_TYPE: compile_send
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          V2_SENDER_ENABLED: ${{ vars.V2_SENDER_ENABLED }}
          V2_LEGACY_SENDER_DISABLED: ${{ vars.V2_LEGACY_SENDER_DISABLED }}
        run: python main.py
      - name: Alert private operator when delivery is withheld by release guard
        if: failure() && steps.eligibility.outcome == 'failure'
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python notify_run_failure.py
