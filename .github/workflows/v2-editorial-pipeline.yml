name: V2 editorial pipeline

# Scheduled jobs run only from the default branch. Research and site publication
# have separate gates; email/WhatsApp use the isolated V2 daily send workflow.
on:
  schedule:
    - cron: '30 22 * * *' # 02:30 Dubai North America
    - cron: '0 0 * * *'   # 04:00 Europe
    - cron: '30 1 * * *'  # 05:30 India & Subcontinent
    - cron: '0 3 * * *'   # 07:00 UAE & Middle East
  workflow_dispatch:
    inputs:
      run_type:
        description: Regional desk; verified stories wait for 09:00 publication
        required: true
        type: choice
        options: [north_america, europe, india_subcontinent, uae_middle_east]
      edition_date:
        description: Scheduled Dubai edition date (YYYY-MM-DD)
        type: string
        required: false
      schedule_key:
        description: External scheduler audit key
        type: string
        required: false
      dry_run:
        description: Suppress Notion writes, Kit, Whapi and refresh
        type: boolean
        default: true

run-name: V2 ${{ inputs.schedule_key || inputs.run_type || github.event.schedule }}

permissions:
  contents: read
concurrency:
  group: v2-editorial-${{ github.event.schedule || inputs.run_type || 'manual' }}
  cancel-in-progress: false

jobs:
  editorial:
    if: github.repository == 'XyLyX/navvyasignal-v2' && (vars.V2_PIPELINE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Check external scheduler ownership
        id: timer
        working-directory: ${{ github.workspace }}
        if: github.event_name == 'schedule'
        env:
          SCHEDULER_STATUS_URL: https://navvyasignal.com/api/scheduler-status
        run: python pipeline/scheduler_ownership.py
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.timer.outputs.external == 'false'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
        if: github.event_name != 'schedule' || steps.timer.outputs.external == 'false'
      - name: Research, verify and stage for 09:00
        id: editorial
        if: github.event_name != 'schedule' || steps.timer.outputs.external == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          OPS_NOTIFY_NUMBER: ${{ secrets.OPS_NOTIFY_NUMBER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          RUN_TYPE: ${{ inputs.run_type }}
          V2_EDITION_DATE: ${{ inputs.edition_date }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python main.py
