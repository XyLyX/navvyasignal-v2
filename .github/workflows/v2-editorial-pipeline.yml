name: V2 editorial pipeline

# Scheduled jobs run only from the default branch. Research and site publication
# have separate gates; email/WhatsApp use the isolated V2 daily send workflow.
on:
  schedule:
    - cron: '30 0 * * *'   # Maritime, 04:30 Dubai
    - cron: '30 3 * * *'   # West Asia, 07:30 Dubai
    - cron: '30 13 * * *'  # India, 17:30 Dubai
    - cron: '30 9 * * *'   # UAE, 13:30 Dubai
    - cron: '30 23 * * *'  # Technology, 03:30 Dubai (next UTC date)
    - cron: '30 4 * * *'   # Global Politics, 08:30 Dubai
    - cron: '30 1 * * *'   # Markets, 05:30 Dubai
    - cron: '30 17 * * *'  # Site edition only, 21:30 Dubai; no sends
    - cron: '15 15 * * 0' # Weekly synthesis, Sunday 19:15 Dubai
  workflow_dispatch:
    inputs:
      run_type:
        description: Desk group, site_only or weekly_synthesis
        required: true
        type: choice
        options: [west_asia, maritime_energy, technology_ai, uae, india, global_politics, markets_capital, site_only, cross_desk, weekly_synthesis]
      edition_date:
        description: Scheduled Dubai edition date (YYYY-MM-DD)
        type: string
        required: false
      schedule_key:
        description: External scheduler audit key
        type: string
        required: false
      dry_run:
        description: Suppress Notion writes, Kit, Whapi and refresh
        type: boolean
        default: true

run-name: V2 ${{ inputs.schedule_key || inputs.run_type || github.event.schedule }}

permissions:
  contents: read
concurrency:
  group: v2-editorial-${{ github.event.schedule || inputs.run_type || 'manual' }}
  cancel-in-progress: false

jobs:
  editorial:
    if: github.repository == 'XyLyX/navvyasignal-v2' && ((github.event_name == 'schedule' && ((github.event.schedule == '30 17 * * *' && vars.V2_SITE_ONLY_ENABLED == 'true') || (github.event.schedule != '30 17 * * *' && vars.V2_PIPELINE_ENABLED == 'true'))) || (github.event_name == 'workflow_dispatch' && inputs.run_type != 'compile_send' && (inputs.dry_run || (inputs.run_type == 'site_only' && vars.V2_SITE_ONLY_ENABLED == 'true') || (inputs.run_type != 'site_only' && vars.V2_PIPELINE_ENABLED == 'true'))))
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Check external scheduler ownership
        id: timer
        working-directory: ${{ github.workspace }}
        if: github.event_name == 'schedule'
        env:
          SCHEDULER_STATUS_URL: https://navvyasignal.com/api/scheduler-status
        run: python pipeline/scheduler_ownership.py
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.timer.outputs.external == 'false'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
        if: github.event_name != 'schedule' || steps.timer.outputs.external == 'false'
      - name: Research, publish and compile
        id: editorial
        if: github.event_name != 'schedule' || steps.timer.outputs.external == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FROM_EMAIL: ${{ secrets.KIT_FROM_EMAIL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          OPS_NOTIFY_NUMBER: ${{ secrets.OPS_NOTIFY_NUMBER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          RUN_TYPE: ${{ inputs.run_type }}
          V2_EDITION_DATE: ${{ inputs.edition_date }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python main.py
      - name: Request isolated V2 refresh
        if: always() && steps.editorial.outputs.notion_stage_attempted == 'true'
        timeout-minutes: 15
        env:
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          DRY_RUN: 'false'
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 refresh_publication.py

