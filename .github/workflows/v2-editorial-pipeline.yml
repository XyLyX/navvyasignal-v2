name: V2 editorial pipeline

# Scheduled jobs run only from the default branch. Research and site publication
# have separate gates; email/WhatsApp remain off until explicitly cut over.
on:
  schedule:
    - cron: '30 0 * * *'   # Maritime, 04:30 Dubai
    - cron: '30 3 * * *'   # West Asia, 07:30 Dubai
    - cron: '30 13 * * *'  # India, 17:30 Dubai
    - cron: '30 9 * * *'   # UAE, 13:30 Dubai
    - cron: '30 23 * * *'  # Technology, 03:30 Dubai (next UTC date)
    - cron: '30 4 * * *'   # Global Politics, 08:30 Dubai
    - cron: '30 1 * * *'   # Markets, 05:30 Dubai
    - cron: '30 17 * * *'  # Site edition only, 21:30 Dubai; no sends
    - cron: '15 15 * * 0' # Weekly synthesis, Sunday 19:15 Dubai
  workflow_dispatch:
    inputs:
      run_type:
        description: Desk group, site_only, compile_send or weekly_synthesis
        required: true
        type: choice
        options: [west_asia, maritime_energy, technology_ai, uae, india, global_politics, markets_capital, site_only, compile_send, weekly_synthesis]
      dry_run:
        description: Suppress Notion writes, Kit, Whapi and refresh
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: v2-editorial-${{ github.event.schedule || inputs.run_type || 'manual' }}
  cancel-in-progress: false

jobs:
  editorial:
    if: github.repository == 'XyLyX/navvyasignal-v2' && ((github.event_name == 'schedule' && ((github.event.schedule == '30 17 * * *' && vars.V2_SITE_ONLY_ENABLED == 'true') || (github.event.schedule != '30 17 * * *' && vars.V2_PIPELINE_ENABLED == 'true'))) || (github.event_name == 'workflow_dispatch' && (inputs.dry_run || (inputs.run_type == 'site_only' && vars.V2_SITE_ONLY_ENABLED == 'true') || (inputs.run_type != 'site_only' && vars.V2_PIPELINE_ENABLED == 'true' && (inputs.run_type != 'compile_send' || vars.V2_LEGACY_SENDER_DISABLED == 'true')))))
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Research, publish and compile
        id: editorial
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FROM_EMAIL: ${{ secrets.KIT_FROM_EMAIL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          OPS_NOTIFY_NUMBER: ${{ secrets.OPS_NOTIFY_NUMBER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          RUN_TYPE: ${{ inputs.run_type }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python main.py
      - name: Request isolated V2 refresh
        if: always() && steps.editorial.outputs.notion_stage_attempted == 'true' && vars.V2_REFRESH_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ! python3 - <<'PY'
          import json, os, sys
          try:
              m = json.load(open('notion-stage-attempted.json'))
              valid = (str(m.get('run_id')) == os.environ['GH_RUN_ID']
                       and str(m.get('attempt')) == os.environ['GH_RUN_ATTEMPT'])
          except (OSError, ValueError, KeyError):
              valid = False
          sys.exit(0 if valid else 1)
          PY
          then
            echo 'V2 refresh marker missing or invalid'; exit 0
          fi
          if ! printf '%s' "${V2_NETLIFY_BUILD_HOOK:-}" | grep -Eq '^https://api\.netlify\.com/build_hooks/[A-Za-z0-9]+$'; then
            echo 'V2 refresh hook missing or malformed'; exit 0
          fi
          curl --fail --silent --show-error --retry 2 --max-time 30 -X POST "$V2_NETLIFY_BUILD_HOOK" \
            && echo 'V2 refresh queued' || echo 'V2 refresh request failed'
