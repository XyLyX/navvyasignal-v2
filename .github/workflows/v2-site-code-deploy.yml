name: V2 deploy production site code
on:
  push:
    branches: [release/v2-english]
    paths:
      - 'navvyasignal-v2-starter/netlify/functions/**'
      - 'navvyasignal-v2-starter/src/**'
      - 'navvyasignal-v2-starter/app/**'
      - 'navvyasignal-v2-starter/package*.json'
      - 'navvyasignal-v2-starter/netlify.toml'
      - '.github/workflows/v2-site-code-deploy.yml'
permissions:
  contents: read
concurrency:
  group: v2-site-code-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'XyLyX/navvyasignal-v2'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 5
    steps:
      - name: Request production build from configured release branch
        env:
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          from urllib.parse import urlsplit
          hook = os.environ.get("V2_NETLIFY_BUILD_HOOK", "").strip()
          parsed = urlsplit(hook)
          if parsed.scheme != "https" or parsed.hostname != "api.netlify.com" or not parsed.path.startswith("/build_hooks/"):
              raise SystemExit("Production build hook missing or invalid")
          request = urllib.request.Request(hook, data=b"{}", headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if not 200 <= response.status < 300:
                      raise SystemExit("Production build request rejected")
          except urllib.error.HTTPError as error:
              raise SystemExit("Production build request failed: HTTP " + str(error.code))
          except urllib.error.URLError:
              raise SystemExit("Production build request unavailable; inspect Netlify before retrying")
          print("Production build requested. Deployment completion must be verified in Netlify.")
          PY
