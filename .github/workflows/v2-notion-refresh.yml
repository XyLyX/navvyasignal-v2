name: Notion approved-content refresh
on:
  push:
    branches: [main]
    paths: ['ops/notion-publication-acceptance.json']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare approved content without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: regional-publication
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'XyLyX/navvyasignal-v2'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31.0' 'psycopg[binary]==3.2.10'
      - name: Validate explicit production acceptance request
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('ops/notion-publication-acceptance.json').read_text())
          if request.get('action') != 'refresh-approved-content' or request.get('no_ai') is not True:
              raise ValueError('Invalid controlled publication acceptance request')
          PY
      - name: Publish only changed approved Notion content
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          PUBLICATION_LEASE_REQUIRED: ${{ vars.PUBLICATION_LEASE_REQUIRED }}
          PUBLICATION_DATABASE_URL: ${{ secrets.PUBLICATION_DATABASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python pipeline/refresh_publication.py --approved-refresh
