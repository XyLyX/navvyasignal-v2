name: Notion approved-content refresh
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare approved content without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: regional-publication
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'XyLyX/navvyasignal-v2'
    runs-on: ubuntu-latest
    environment: v2-preview
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31.0'
      - name: Publish only changed approved Notion content
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '35b11486-b145-80ac-891f-000bd4c62627' }}
          V2_NETLIFY_BUILD_HOOK: ${{ secrets.V2_NETLIFY_BUILD_HOOK }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python pipeline/refresh_publication.py --approved-refresh
