[build]
command = "npm run build"
publish = "out"

# V1 legacy article preservation after Framer is connected to archive.navvyasignal.com.
# Unforced redirect: existing V2 /signals/<uuid> static pages take precedence.
[[redirects]]
from = "/signals/*"
to = "https://archive.navvyasignal.com/signals/:splat"
status = 301
force = false
