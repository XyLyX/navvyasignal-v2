[build]
command = "npm run build"
publish = "out"

# Reject automatic Git-triggered builds. Netlify intentionally bypasses this
# ignore command for build-hook requests, preserving the fenced GitHub
# publication workflow. Never change this to stop builds at site level.
ignore = "exit 0"

# Historical article redirects are intentionally disabled until the Framer\n# archive hostname and original V1 article path structure are verified.\n# The /old-archives-v1 landing page links to the existing Framer base address.\n
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
